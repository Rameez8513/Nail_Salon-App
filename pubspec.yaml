name: nail_salon
description: "Nail Salon — a staff management app for beauty and nail salons. Employees manage their daily schedule, clients, and services, while admins oversee staff, appointments, and inventory. Built with Flutter and Firebase for real-time, cross-platform (Android & iOS) performance."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3

  provider: ^6.1.2
  url_launcher: ^6.3.1

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  intl: ^0.19.0

  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.1
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    # - assets/icons/

flutter_native_splash:
  color: "#0A0A0A"
  image: assets/images/splash_logo.png
  android_12:
    color: "#0A0A0A"
    image: assets/images/splash_logo.png
  android: true
  ios: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/Nail_Salon.png"
  adaptive_icon_background: "#0A0A0A"
  adaptive_icon_foreground: "assets/images/Nail_Salon_foreground.png"